<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promises — dontforget</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<nav class="topbar">
  <a href="../" class="logo">dont<span>.</span>forget</a>
  <div class="links">
    <a href="../">Today</a>
    <a href="index.html" class="active">Promises</a>
    <a href="../about.html">About</a>
  </div>
</nav>

<main>

  <div class="date-hero">
    <div class="lives-count" style="font-size:clamp(2rem,6vw,3.5rem);color:var(--ink);" id="promise-count">—</div>
    <div class="lives-label">promises tracked</div>
    <div class="stats" style="margin-top:0.8rem;">
      <div class="stat"><div class="stat-num" id="stat-kept">—</div><div class="stat-label">Kept</div></div>
      <div class="stat"><div class="stat-num" id="stat-broken">—</div><div class="stat-label">Broken</div></div>
      <div class="stat"><div class="stat-num" id="stat-partial">—</div><div class="stat-label">Partial</div></div>
      <div class="stat"><div class="stat-num" id="stat-pending">—</div><div class="stat-label">Pending</div></div>
    </div>
  </div>

  <hr class="rule">

  <div class="filter-bar" id="promise-filters">
    <span class="filter-chip active" data-filter="all">all</span>
    <span class="filter-chip" data-filter="kept">kept</span>
    <span class="filter-chip" data-filter="broken">broken</span>
    <span class="filter-chip" data-filter="partial">partial</span>
  </div>

  <div id="promises-container">
    <div class="date-hero" style="padding-top:3rem;">
      <div class="lives-label" style="color:var(--stone);">Loading…</div>
    </div>
  </div>

</main>

<footer>
  <p>UTC &middot; <a href="../about.html">About</a></p>
</footer>

<script>
(function() {
  var statusClass = { kept: 'kept', broken: 'broken', partial: 'pending', pending: 'pending' };
  var statusMark = { kept: '&#10003;', broken: '&#10007;', partial: '&#9675;', pending: '&#9675;' };

  fetch('../_data/promises.json')
    .then(function(r) { return r.json(); })
    .then(function(promises) {
      var today = new Date().toISOString().slice(0, 10);
      var due = promises.filter(function(p) { return p.due_date <= today; });

      document.getElementById('promise-count').textContent = due.length;
      document.getElementById('stat-kept').textContent = due.filter(function(p) { return p.status === 'kept'; }).length;
      document.getElementById('stat-broken').textContent = due.filter(function(p) { return p.status === 'broken'; }).length;
      document.getElementById('stat-partial').textContent = due.filter(function(p) { return p.status === 'partial'; }).length;
      document.getElementById('stat-pending').textContent = due.filter(function(p) { return p.status === 'pending'; }).length;
      document.getElementById('stat-kept').className = 'stat-num kept';
      document.getElementById('stat-broken').className = 'stat-num broken';
      document.getElementById('stat-partial').className = 'stat-num partial';
      document.getElementById('stat-pending').className = 'stat-num pending';

      // Group past-due promises by due month
      var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      var groups = {};
      due.forEach(function(p) {
        var ym = p.due_date.slice(0, 7);
        if (!groups[ym]) groups[ym] = [];
        groups[ym].push(p);
      });

      function renderPromises(filter) {
        var html = '';
        Object.keys(groups).sort().reverse().forEach(function(ym) {
          var parts = ym.split('-');
          var label = months[parseInt(parts[1]) - 1] + ' ' + parts[0];
          var items = filter === 'all' ? groups[ym] : groups[ym].filter(function(p) { return p.status === filter; });
          if (items.length === 0) return;
          html += '<div class="eyebrow">' + label + '</div>';
          items.forEach(function(p) {
            var cls = statusClass[p.status] || 'pending';
            html += '<article class="card card-' + cls + '">' +
              '<h3>' + p.promise + '</h3>' +
              '<div class="meta-line">' +
                '<span class="status-mark status-' + cls + '">' + statusMark[p.status] + '</span> ' +
                p.person + ', ' + p.role + ' · Due: ' + p.due_date +
                '<span class="badge badge-' + cls + '" style="margin-left:0.5rem;">' + p.status + '</span>' +
              '</div>' +
              '<p>' + p.description + '</p>' +
              '<div class="sources">Sources: ' + p.sources.join(' · ') + '</div>' +
              '</article>';
          });
        });
        if (!html) html = '<div class="date-hero" style="padding-top:2rem;"><div class="lives-label" style="color:var(--stone);text-transform:none;font-family:\'Newsreader\',Georgia,serif;font-size:1.05rem;">No promises in this category.</div></div>';
        document.getElementById('promises-container').innerHTML = html;
      }

      renderPromises('all');

      document.querySelectorAll('#promise-filters .filter-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          document.querySelectorAll('#promise-filters .filter-chip').forEach(function(c) { c.classList.remove('active'); });
          this.classList.add('active');
          renderPromises(this.dataset.filter);
        });
      });
    })
    .catch(function() {
      document.getElementById('promises-container').innerHTML = '<div class="date-hero" style="padding-top:3rem;"><div class="lives-label" style="color:var(--c-war);">Could not load promises.</div></div>';
    });
})();
</script>
</body>
</html>
