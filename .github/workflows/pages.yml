name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      page-hashes: ${{ steps.hashes.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test data pipeline
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test page behavior
        run: node --test tests/pages.test.cjs
      - name: Generate data chunks
        run: python3 site/_data/split_data.py
      - name: Validate datasets
        run: python3 site/_data/validate.py
      - name: Fingerprint public pages and data indexes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: hashes
        working-directory: site
        run: |
          files=(index.html promises/index.html _data/checkpoint.json _data/events/index.json _data/promises/index.json)
          files+=("_data/$(jq -er '.windows[0].file' _data/events/index.json)")
          due_month=$(jq -r 'first(.months[] | select(.due) | .file) // empty' _data/promises/index.json)
          if [[ -n "$due_month" ]]; then files+=("_data/$due_month"); fi
          {
            echo 'files<<HASHES'
            sha256sum "${files[@]}"
            echo HASHES
          } >> "$GITHUB_OUTPUT"
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published pages, indexes and sample data chunks
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PAGE_HASHES: ${{ needs.validate.outputs.page-hashes }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          base="${base/#http:/https:}"
          [[ -n "$PAGE_HASHES" && "$base" == https://* ]]
          while read -r expected path; do
            for attempt in 1 2 3 4 5; do
              if actual=$(curl -fsSL --proto '=https' --max-time 15 "$base/$path?rev=$GITHUB_SHA&probe=$attempt" | sha256sum) &&
                 [[ "${actual%% *}" == "$expected" ]]; then
                echo "Verified $path"
                break
              fi
              if [[ "$attempt" == 5 ]]; then echo "::error::Published $path did not match the Pages artifact"; exit 1; fi
              sleep 8
            done
          done <<< "$PAGE_HASHES"
